<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BEG Trading Agents - Office</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Press Start 2P', monospace;
    background: #1a1a2e;
    color: #fff;
    padding: 16px;
  }
  h1 {
    text-align: center;
    font-size: 16px;
    color: #ffd700;
    text-shadow: 2px 2px #000;
    margin-bottom: 4px;
  }
  #updated {
    text-align: center;
    font-size: 9px;
    color: #aaa;
    margin-bottom: 16px;
  }

  .office-frame {
    max-width: 1000px;
    margin: 0 auto;
    border: 6px solid #4a2f1a;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 8px 0 #000, inset 0 0 0 4px #6b4423;
  }

  .pipeline {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 4px;
    background:
      repeating-linear-gradient(90deg, #a97c50 0 40px, #96693f 40px 80px);
    padding: 24px 12px 34px;
    position: relative;
  }
  .room-label {
    position: absolute;
    top: 8px;
    left: 10px;
    font-size: 8px;
    background: rgba(0,0,0,0.5);
    padding: 4px 6px;
    border-radius: 4px;
    color: #ffd700;
  }

  .desk {
    background: #5c3a1a;
    border: 3px solid #3a2410;
    border-radius: 6px;
    padding: 10px 8px 8px;
    text-align: center;
    box-shadow: 0 3px 0 #241505;
    width: 110px;
    position: relative;
    min-height: 110px;
  }
  .speech {
    position: absolute;
    top: -22px;
    left: 50%;
    transform: translateX(-50%);
    background: #fff;
    color: #111;
    font-size: 6px;
    padding: 3px 5px;
    border-radius: 4px;
    white-space: nowrap;
    box-shadow: 0 2px 0 #000;
  }
  .speech::after {
    content: "";
    position: absolute;
    bottom: -5px;
    left: 50%;
    transform: translateX(-50%);
    border-width: 5px 4px 0 4px;
    border-style: solid;
    border-color: #fff transparent transparent transparent;
  }

  .avatar-wrap {
    height: 34px;
    position: relative;
    overflow: visible;
  }
  .avatar {
    font-size: 28px;
    display: inline-block;
    position: relative;
    animation: walk 2.2s infinite ease-in-out;
  }
  @keyframes walk {
    0%   { transform: translateX(-10px) scaleX(1); }
    45%  { transform: translateX(10px) scaleX(1); }
    50%  { transform: translateX(10px) scaleX(-1); }
    95%  { transform: translateX(-10px) scaleX(-1); }
    100% { transform: translateX(-10px) scaleX(1); }
  }
  .avatar.idle {
    animation: none;
    opacity: 0.45;
    filter: grayscale(60%);
  }

  .agent-name {
    font-size: 7px;
    margin: 6px 0 3px;
    color: #ffe9b0;
  }
  .status-badge {
    display: inline-block;
    font-size: 6px;
    padding: 3px 5px;
    border-radius: 3px;
    margin-top: 3px;
  }
  .status-working { background: #2ecc71; color: #003300; }
  .status-idle { background: #555; color: #ccc; }
  .status-alert { background: #f1c40f; color: #3d2b00; animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }

  .arrow {
    font-size: 20px;
    color: #ffd700;
    animation: arrowpulse 1.2s infinite;
  }
  .arrow.dim { color: #555; animation: none; }
  @keyframes arrowpulse {
    0%, 100% { opacity: 1; transform: translateX(0); }
    50% { opacity: 0.4; transform: translateX(4px); }
  }

  .signal-section {
    background:
      repeating-linear-gradient(90deg, #2c3e6b 0 40px, #26355c 40px 80px);
    padding: 20px 16px;
    text-align: center;
    border-top: 4px solid #4a2f1a;
  }
  .desk-table {
    background: #3b2c1e;
    border: 4px solid #241a10;
    width: 140px;
    height: 60px;
    margin: 0 auto 10px;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 26px;
    box-shadow: 0 4px 0 #150e08;
  }
  .signal-text {
    font-size: 13px;
    margin: 10px 0;
  }
  .buy-call { color: #2ecc71; text-shadow: 0 0 8px #2ecc71; }
  .buy-put { color: #e74c3c; text-shadow: 0 0 8px #e74c3c; }
  .none-signal { color: #aaa; }

  .metrics {
    display: flex;
    justify-content: center;
    gap: 20px;
    font-size: 7px;
    margin-top: 10px;
  }
  .metrics div { background: rgba(0,0,0,0.4); padding: 6px 8px; border-radius: 4px; }

  .chart-wrap {
    text-align: center;
    padding: 16px;
    background: #12121f;
  }
  .chart-wrap img {
    width: 100%;
    max-width: 700px;
    border: 4px solid #ffd700;
    border-radius: 8px;
  }

  footer {
    text-align: center;
    font-size: 7px;
    color: #777;
    margin-top: 20px;
  }
</style>
</head>
<body>

<h1>BEG TRADING AGENTS OFFICE</h1>
<div id="updated">Loading...</div>

<div class="office-frame">
  <div class="pipeline" id="pipeline">
    <div class="room-label">MAIN OFFICE - WORKFLOW</div>
  </div>

  <div class="signal-section">
    <div class="desk-table">📈</div>
    <h2 style="font-size:10px;color:#ffd700;">NIFTY SIGNAL BOARD</h2>
    <div class="signal-text none-signal" id="signalText">Loading...</div>
    <div class="metrics" id="metricsBox"></div>
  </div>

  <div class="chart-wrap" id="chartWrap"></div>
</div>

<footer>Auto-refreshes every 30s. Powered by BEG Agriculture Vision Trading Stack.</footer>

<script>
const AGENTS = [
  { key: "data", name: "DATA AGENT", avatar: "🧑‍💻", action: "FETCHING PRICE" },
  { key: "analysis", name: "ANALYSIS AGENT", avatar: "🧑‍🔬", action: "CHECKING EMA" },
  { key: "signal", name: "SIGNAL AGENT", avatar: "🧑‍✈️", action: "DECIDING" },
  { key: "chart", name: "CHART AGENT", avatar: "🧑‍🎨", action: "DRAWING CHART" },
  { key: "notifier", name: "NOTIFIER AGENT", avatar: "🧑‍💼", action: "SENDING ALERT" },
  { key: "news", name: "NEWS AGENT", avatar: "🧑‍📰", action: "FETCHING NEWS" }
];

async function loadStatus() {
  try {
    const res = await fetch('status.json?t=' + Date.now());
    const status = await res.json();
    render(status);
  } catch (e) {
    document.getElementById('updated').innerText = "Waiting for first data...";
  }
}

function render(status) {
  document.getElementById('updated').innerText = "Last updated: " + (status.updated_at || "Unknown");

  const agentState = status.agent_status || "unknown";
  const signal = status.signal || "NONE";

  const pipelineEl = document.getElementById('pipeline');
  pipelineEl.innerHTML = '<div class="room-label">MAIN OFFICE - WORKFLOW</div>';

  AGENTS.forEach((agent, idx) => {
    let working = true;
    let badgeClass = "status-working";
    let badgeText = "WORKING";
    let action = agent.action;

    if (agent.key === "signal") {
      working = agentState === "signal_sent";
      badgeText = working ? signal : "WATCHING";
      badgeClass = working ? "status-alert" : "status-working";
      action = working ? signal : "DECIDING";
    }
    if (agent.key === "chart") {
      working = agentState === "signal_sent";
      badgeText = working ? "READY" : "STANDBY";
      badgeClass = working ? "status-working" : "status-idle";
      action = working ? "CHART READY" : "STANDBY";
    }
    if (agent.key === "notifier") {
      working = agentState === "signal_sent";
      badgeText = working ? "SENT" : "IDLE";
      badgeClass = working ? "status-working" : "status-idle";
      action = working ? "ALERT SENT" : "IDLE";
    }
    if (agentState === "outside_window" && agent.key !== "news") {
      working = false;
      badgeText = "OFF HOURS";
      badgeClass = "status-idle";
      action = "OFF HOURS";
    }

    const desk = document.createElement('div');
    desk.className = "desk";
    desk.innerHTML = `
      <div class="speech">${action}</div>
      <div class="avatar-wrap">
        <span class="avatar ${working ? '' : 'idle'}">${agent.avatar}</span>
      </div>
      <div class="agent-name">${agent.name}</div>
      <div class="status-badge ${badgeClass}">${badgeText}</div>
    `;
    pipelineEl.appendChild(desk);

    if (idx < AGENTS.length - 1) {
      const arrow = document.createElement('div');
      arrow.className = "arrow" + (working ? "" : " dim");
      arrow.innerText = "➡️";
      pipelineEl.appendChild(arrow);
    }
  });

  const signalTextEl = document.getElementById('signalText');
  const metricsBox = document.getElementById('metricsBox');
  if (agentState === "signal_sent") {
    signalTextEl.innerText = signal;
    signalTextEl.className = "signal-text " + (signal === "BUY CALL" ? "buy-call" : "buy-put");
    metricsBox.innerHTML = `
      <div>ENTRY<br>${status.entry}</div>
      <div>TARGET<br>${status.target}</div>
      <div>SL<br>${status.stop_loss}</div>
    `;
  } else if (agentState === "outside_window") {
    signalTextEl.innerText = "OUTSIDE WINDOW";
    signalTextEl.className = "signal-text none-signal";
    metricsBox.innerHTML = "";
  } else if (agentState === "already_traded") {
    signalTextEl.innerText = "TRADED TODAY";
    signalTextEl.className = "signal-text none-signal";
    metricsBox.innerHTML = "";
  } else {
    signalTextEl.innerText = "WATCHING (" + (status.nifty_close || "-") + ")";
    signalTextEl.className = "signal-text none-signal";
    metricsBox.innerHTML = "";
  }

  const chartWrap = document.getElementById('chartWrap');
  if (agentState === "signal_sent") {
    chartWrap.innerHTML = '<img src="dashboard_chart.png?t=' + Date.now() + '" alt="chart">';
  } else {
    chartWrap.innerHTML = "";
  }
}

loadStatus();
setInterval(loadStatus, 30000);
</script>

</body>
</html>
