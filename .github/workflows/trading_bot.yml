name: BEG Trading Agents

on:
  schedule:
    - cron: '*/15 3-10 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python orchestrator.py
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SMARTAPI_API_KEY: ${{ secrets.SMARTAPI_API_KEY }}
          SMARTAPI_CLIENT_ID: ${{ secrets.SMARTAPI_CLIENT_ID }}
          SMARTAPI_PASSWORD: ${{ secrets.SMARTAPI_PASSWORD }}
          SMARTAPI_TOTP_SECRET: ${{ secrets.SMARTAPI_TOTP_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CAPITAL: "100000"
      - name: Commit dashboard data
        run: |
          git config user.name "BEG Trading Bot"
          git config user.email "bot@beg-trading.local"
                    git add status.json
          [ -f dashboard_chart.png ] && git add dashboard_chart.png || true
          git diff --staged --quiet || git commit -m "Update dashboard data [skip ci]"
          git push
